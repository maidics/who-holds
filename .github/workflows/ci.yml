name: CI

on:
  push:
    paths-ignore:
      - '.claude/**'
      - '.docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # cancels in progress run if pushing again

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IS_TAG_PUSH: ${{ github.ref_type == 'tag' }}

jobs:
  pipeline:
    runs-on: windows-latest # Latest Windows Server
    
    steps:
      - name: Disable Defender real-time scanning
        if: runner.environment == 'github-hosted' # must only run on the GitHub host
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: pwsh
    
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run pipeline
        run: dotnet run --project src/WhoHolds.Pipeline/WhoHolds.Pipeline.csproj --configuration Release